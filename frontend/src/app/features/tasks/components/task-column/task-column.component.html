<div class="task-column">
  <header class="task-column__header">
    <div class="task-date">
      <p>{{ date | date: 'd MMM' }}</p>
      <p>{{ ((date | date: 'EEEE') || '').split('-')[0] | titlecase }}</p>
    </div>
  </header>

  <div class="task-column__content-wrapper">
    <div
      class="task-column__list"
      cdkDropList
      [cdkDropListData]="tasks"
      (cdkDropListDropped)="drop($event)"
    >
      @for (task of tasks; track task.id) {
        <app-task-item
          class="task-column__item"
          [task]="task"
          (statusChange)="updateTaskStatus($event)"
          cdkDrag
        />
      }

      <app-task-input class="task-column__input" [date]="date" />
    </div>
  </div>
</div>
